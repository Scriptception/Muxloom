name: Bug report
description: Report a reproducible Muxloom problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private prompts, or terminal transcripts containing secrets.
  - type: input
    id: version
    attributes:
      label: Muxloom version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Linux distribution and terminal
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
